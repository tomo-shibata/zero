# sqlc の設定。スキーマは goose のマイグレーション（Down の部分は sqlc が読み飛ばす）を正とする。
# クエリは db/query/ に置く。生成コード（sqlcgen）は手で書き換えず、task sqlc で作り直す。
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/query
    gen:
      go:
        package: sqlcgen
        out: internal/infrastructure/persistence/sqlcgen
        sql_package: pgx/v5
