# タスクランナー（go-task v3）。task <名前> で実行する（task --list で一覧）。
# docker・go・npm と、$(go env GOPATH)/bin にある task・sqlc・golangci-lint（v2 系）・govulncheck が PATH にあること。
# govulncheck は go install golang.org/x/vuln/cmd/govulncheck@latest で入れる。
#
# テンプレートの値（{{.…}}）をコマンドに埋め込むときは q（shellQuote）で引用する。
# 引数や環境変数の値に空白や & ; などがあっても、シェルに解釈させずに1つの値として渡すため。
version: "3"

vars:
  # docker-compose.yml の PostgreSQL にある開発用 DB。呼び出し側が DATABASE_URL を渡さないときに使う。
  # ホストを localhost にしないのは、Windows で先に IPv6 の ::1 に解決され、接続が遅れたり別のサーバーにつながったりするため。
  DEV_DATABASE_URL: postgres://zero:zero@127.0.0.1:5432/zero?sslmode=disable
  # E2E 用の DB（プラン 4.5）。task e2e:api が起動のたびに作り直す。e2e/fixtures/db.ts の接続先と合わせる。
  # 呼び出し側の DATABASE_URL では変えない（開発用 DB を作り直したり、E2E のデータを入れ替えたりしないため）。
  E2E_DATABASE_URL: postgres://zero:zero@127.0.0.1:5432/zero_e2e?sslmode=disable
  # E2E 用の API のポート。e2e/playwright.config.ts の API_URL と合わせる。
  E2E_API_PORT: "8081"
  # E2E の API がログイン中の利用者として扱う利用者A（db/seed/test.sql）。e2e/fixtures/db.ts の USER_A_ID と合わせる。
  E2E_DEV_USER_ID: 00000000-0000-0000-0000-00000000000a

tasks:
  setup:
    desc: 依存をインストールする（backend・frontend・e2e と、E2E 用のブラウザ）
    cmds:
      - cd backend && go mod download
      - cd frontend && npm ci
      - cd e2e && npm ci
      - cd e2e && npx playwright install chromium

  dev:
    desc: 開発環境をまとめて起動する（DB・API・フロントエンド。DEV_USER_ID は必須。例 task dev DEV_USER_ID=00000000-0000-0000-0000-000000000001）
    summary: |
      backend:dev（DB の起動とマイグレーションを含む）と frontend:dev を同時に起動する。Ctrl+C で両方止まる。
      どちらかが失敗して終わったら（DEV_USER_ID がない、ポートが使用中など）、もう一方も止める。
      DEV_USER_ID などの変数は backend:dev と同じ（task --summary backend:dev）。task の引数でも環境変数でも渡せる。
        例: task dev DEV_USER_ID=00000000-0000-0000-0000-000000000001
      画面は http://localhost:5173 で開く（/api は API サーバーに転送される）。
    # deps は同時に実行されるので、API とフロントエンドの dev サーバーが並んで動く。
    # task の引数の変数（DEV_USER_ID など）は deps の backend:dev にも渡る。
    deps: [backend:dev, frontend:dev]
    # 1つが失敗したら、残りも止める。既定では残りが動き続け、API が起動していないのに画面だけが開けて、
    # 取得失敗のダイアログの原因が分かりにくくなるため（PR④ ステップ6 の EC-8）。
    # 止めたプロセスの子が裏に残らないよう、frontend:dev は Vite を直接起動する（frontend:dev のコメント）。
    # ただし、フロントエンドだけが失敗して終わったとき、Windows では task が止めるのは backend:dev の go run だけで、
    # go run がビルドして起動した API（api.exe）は裏に残り、ポートをつかんだままになることがある（PR④ ステップ6 2ラウンド目の EC-12）。
    # そのときは、タスクマネージャーなどで api.exe を止める。次の task dev がポートの使用中で失敗したら、これを疑う。
    failfast: true

  build:
    desc: バックエンドとフロントエンドをビルドする
    cmds:
      - task: backend:build
      - task: frontend:build

  test:
    desc: すべてのテスト（backend の単体・統合、frontend の単体、E2E）を実行する
    cmds:
      - task: backend:test
      - task: frontend:test
      - task: e2e

  lint:
    desc: バックエンドとフロントエンドをリントする
    cmds:
      - task: backend:lint
      - task: frontend:lint

  fmt:
    desc: バックエンドの Go のコードを整形する（golangci-lint の gofmt・goimports。フロントエンドの整形ツールは入れていない）
    dir: backend
    cmds:
      # backend:lint と同じ設定（backend/.golangci.yml の formatters）で整形する。
      - golangci-lint fmt

  db:up:
    desc: PostgreSQL のコンテナを起動し、接続を受け付けるまで待つ
    cmds:
      - docker compose up -d --wait

  db:migrate:
    desc: DATABASE_URL の DB（既定は開発用 DB）にマイグレーションを適用する
    deps: [db:up]
    dir: backend
    cmds:
      # DATABASE_URL は、task の引数 → OS の環境変数 → 開発用 DB の順に決めて、コマンドの前に付けて渡す。
      # env: で渡さないのは、OS の環境変数があると env: より優先され、引数で渡した DATABASE_URL が黙って無視されるため。
      # silent にするのは、task がコマンドを端末に出すと、DATABASE_URL のパスワードまで出てしまうため。
      # 接続先（ホスト・ポート・DB 名。パスワードは含めない）は cmd/migrate がログに出す。
      - cmd: DATABASE_URL={{q (.DATABASE_URL | default .DEV_DATABASE_URL)}} go run ./cmd/migrate
        silent: true

  db:seed:
    desc: マイグレーションを適用してから SEED_FILE（既定は db/seed/dev.sql）を流す
    summary: |
      マイグレーションを適用してから、SEED_FILE の SQL（DML）を DATABASE_URL の DB（既定は開発用 DB）に流す。
      SEED_FILE は backend/ からの相対パス。既定は db/seed/dev.sql（開発用利用者と、7203・6758 の保有のサンプル）。
      dev.sql は空の DB に1回だけ流す（2回目は利用者の主キーの重複で失敗し、何も変わらない）。
      seed には BEGIN・COMMIT を書かない（ファイル全体を1つのトランザクションとして流すため）。
      自分の保有銘柄などの個人のデータは backend/db/seed/*.local.sql に置く（git 管理外）。
        例: task db:seed SEED_FILE=db/seed/my.local.sql
    deps: [db:up]
    dir: backend
    vars:
      SEED_FILE: '{{.SEED_FILE | default "db/seed/dev.sql"}}'
    cmds:
      # DATABASE_URL の決め方と渡し方、silent にする理由は db:migrate と同じ。
      - cmd: DATABASE_URL={{q (.DATABASE_URL | default .DEV_DATABASE_URL)}} go run ./cmd/migrate -seed {{q .SEED_FILE}}
        silent: true

  db:clean-test:
    desc: テストが異常終了して残ったテスト用の DB（名前が zero_test_ か zero_guard_ で始まるもの。zero_guard_ は migrate_recreate_test.go と合わせる）を消す。テストの実行中には流さない
    summary: |
      docker-compose.yml の PostgreSQL から、名前が zero_test_ か zero_guard_ で始まる DB だけを消す。
      開発用 DB（zero）と E2E 用 DB（zero_e2e）は、どちらの名前でも始まらないので消さない。
      testdb やテストはテストの終了時に DB を消すが、テストのプロセスが異常終了すると消せずに残るため。
        zero_test_  … testdb が作る DB。zero_test_ は backend/internal/infrastructure/database の TestDatabasePrefix と合わせる。
        zero_guard_ … -recreate の拒否を確かめるテストが作る使い捨ての DB。zero_guard_ は backend/test/integration/migrate_recreate_test.go と合わせる。
      テストの実行中には流さない（接続していない間のテスト用 DB を消すことがある）。
      接続中の DB は消さずに残す。消した DB は「DROP DATABASE IF EXISTS …」と出る。
    deps: [db:up]
    # psql が実行する SQL を出す（-e）ので、task のコマンドの表示は省く（同じ SQL が2回出ないように）。
    silent: true
    cmds:
      # LIKE ではなく starts_with で比べるのは、LIKE の _ が任意の1文字に当たり、zero_test_ などで始まらない DB まで消すおそれがあるため。
      # zero_test_ は backend/internal/infrastructure/database の TestDatabasePrefix と合わせる。
      # zero_guard_ は backend/test/integration/migrate_recreate_test.go と合わせる（-recreate の拒否を確かめるために、そのテストが作る使い捨ての DB の名前）。
      # どちらかを変えるときは、ここもあわせて変える（開発用 DB の zero や E2E 用の zero_e2e に当たる名前にはしない）。
      # DROP DATABASE はトランザクションの中で実行できないので、psql の \gexec で1つずつ実行する。
      # IF EXISTS にするのは、一覧を作ってから DROP するまでの間に、テストが自分で DB を消していても失敗しないため。
      - |
        docker compose exec -T postgres psql -U zero -d postgres -X -q -e -v ON_ERROR_STOP=1 <<'SQL'
        SELECT format('DROP DATABASE IF EXISTS %I', d.datname)
        FROM pg_database AS d
        WHERE (starts_with(d.datname, 'zero_test_') OR starts_with(d.datname, 'zero_guard_'))
          AND NOT EXISTS (SELECT 1 FROM pg_stat_activity AS a WHERE a.datname = d.datname)
        ORDER BY d.datname
        \gexec
        SQL

  sqlc:
    desc: db/query/ の SQL から Go のコードを生成する（backend/sqlc.yaml）
    dir: backend
    cmds:
      - sqlc generate

  backend:dev:
    desc: マイグレーションを適用してから API サーバーを起動する（127.0.0.1 だけで待ち受ける。ポートは PORT、既定 8080。80 では /api/ に届かない。DEV_USER_ID は users にある利用者で必須）
    summary: |
      マイグレーションを適用してから（db:migrate）、API サーバーを起動する。127.0.0.1 だけで待ち受ける。
      接続先の DB は DATABASE_URL（既定は開発用 DB）。マイグレーションも同じ DB に適用する。
      ポートは PORT（既定 8080）。PORT=80 にはしない。ブラウザは HTTP の既定のポート 80 を Host ヘッダーに付けないが、
      /api/ の Host の許可リストはポート付き（127.0.0.1:80 など）で比べるので、/api/ がすべて 403 になる（/healthz は応答する）。
      DEV_USER_ID（必須）は、ログイン中の利用者として扱う開発用利用者の UUID。DB の users にある利用者にする
      （users にない UUID でも起動し、/api/holdings は 0件を返すので、誤りに気づきにくい）。
      DEV_USER_ID は task の引数でも環境変数でも渡せる（task の引数が優先）。
      task db:seed で db/seed/dev.sql を流した DB なら、その利用者は次のとおり。
        例: task backend:dev DEV_USER_ID=00000000-0000-0000-0000-000000000001
    # db:up は db:migrate の deps にあるので、ここには書かない（両方に書くと docker compose up が同時に2回動く）。
    # マイグレーションを先に適用するのは、未適用のまま起動して、リクエストのたびに 500 を返さないようにするため。
    deps: [db:migrate]
    dir: backend
    cmds:
      # DATABASE_URL の決め方と渡し方、silent にする理由は db:migrate と同じ。
      # DEV_USER_ID も、task の引数 → OS の環境変数の順に決めて、コマンドの前に付けて渡す（PowerShell などの
      # 「VAR=値 task …」と書けないシェルからでも、task の引数で渡せるように。PR④ ステップ6 の EC-8）。
      # どちらもなければ空で渡し、cmd/api が起動時にエラーにする（default "" は、未設定の変数を q に渡すとテンプレートが失敗するため）。
      - cmd: DATABASE_URL={{q (.DATABASE_URL | default .DEV_DATABASE_URL)}} DEV_USER_ID={{q (.DEV_USER_ID | default "")}} go run ./cmd/api
        silent: true

  prices:fetch:
    desc: 誰かが保有している銘柄の終値を取得元（当面はダミー）から取得して保存する（18:00 の定時実行と同じ処理を1回）
    summary: |
      マイグレーションを適用してから（db:migrate）、誰かの保有数量が1以上の銘柄（売り切った銘柄は除く）の終値を
      取得元から取得し、取引日とともに DATABASE_URL の DB（既定は開発用 DB）に保存する。
      API サーバー（cmd/api）が毎日 18:00（日本時間）に実行するのと同じ処理を、開発・テスト用に手で1回実行する（要件 FR-15a）。
      同じ銘柄・同じ取引日の終値がすでにあれば上書きする（何度実行してもよい）。
      当面の取得元はダミーで、7203・6758 以外の銘柄は「取得できない」になる（保存済みの価格はそのまま残る）。
      取得・保存できなかった銘柄があっても終了コードは 0（その銘柄はログに出る）。
      0 以外になるのは、保有している銘柄を読めないときや、Ctrl+C で途中で止めたときなど。成否は 0 かどうかで判断する。
      cmd/fetch-prices 自体はこのとき 1 で終わるが、task は失敗したコマンドの終了コードを既定で 201 にして返す。
      cmd/fetch-prices の終了コード（1）をそのまま返させるには task -x prices:fetch で実行する。
    # マイグレーションを先に適用するのは、未適用の DB で実行して、テーブルがないと失敗しないようにするため（backend:dev と同じ）。
    # db:up は db:migrate の deps にあるので、ここには書かない。
    deps: [db:migrate]
    dir: backend
    cmds:
      # DATABASE_URL の決め方と渡し方、silent にする理由は db:migrate と同じ。
      # 呼び出し側の DATABASE_URL（統合テスト AC-14b がテスト用の DB を渡す）を上書きしない（プラン 4.5）。
      # 接続先（ホスト・ポート・DB 名。パスワードは含めない）は cmd/fetch-prices がログに出す。
      - cmd: DATABASE_URL={{q (.DATABASE_URL | default .DEV_DATABASE_URL)}} go run ./cmd/fetch-prices
        silent: true

  trades:import:
    desc: 売買履歴の CSV を、指定した利用者の売買履歴として取り込む（CSV_FILE と USER_ID が必須。その利用者の売買履歴は全部入れ替わる）
    summary: |
      マイグレーションを適用してから（db:migrate）、CSV_FILE の売買履歴を、USER_ID の利用者の売買履歴として
      DATABASE_URL の DB（既定は開発用 DB）に取り込む（売買履歴の要件19〜要件26）。
        例: task trades:import CSV_FILE=trades.local.csv USER_ID=00000000-0000-0000-0000-000000000001
        見本で試す例（リポジトリの直下で実行。開発用利用者は task db:seed で入れたもの）:
          task trades:import CSV_FILE=backend/db/seed/trades.example.csv USER_ID=00000000-0000-0000-0000-000000000001
      よくある誤りの直し方: Excel では「CSV UTF-8（コンマ区切り）」で保存する（文字コードの誤りになるため）。
      価格と株数に3桁区切りのカンマ（1,000 など）は使えない（数字だけで書く）。
      CSV_FILE の相対パスは、task を実行したディレクトリからのパス（backend/ からではない）。絶対パスも使える。
      見本の CSV は backend/db/seed/trades.example.csv。自分の売買履歴は *.local.csv（git 管理外）に置く。
      取り込みは「その利用者の売買履歴をすべて削除する → 銘柄マスタを足す・銘柄名を直す → CSV のすべての行を登録する」を
      1つのまとまりで行う。CSV に誤りが1つでもあれば、誤りをすべて標準エラーに出して、何も変えずに終わる。
      成功は終了コード 0。誤りのときは、cmd/import-trades が 1 で終わるが、task は失敗したコマンドの終了コードを既定で 201 にして返す
      （task -x trades:import で実行すると 1 のまま返る）。成否は 0 かどうかで判断する。
      CSV の書き方（見出し・列・誤りの文言）は docs/requirements/trade-history.md の要件22〜要件25 と「CSV の誤りの文言」。
    # マイグレーションを先に適用するのは、未適用の DB に取り込んで、テーブルがないと失敗しないようにするため（db:seed と同じ）。
    # db:up は db:migrate の deps にあるので、ここには書かない。
    deps: [db:migrate]
    dir: backend
    cmds:
      # requires: を使わないのは、CSV_FILE や USER_ID がないときに、task が独自の文言で止まらず、
      # 空のまま cmd/import-trades に渡して「CSV_FILE と USER_ID を指定してください」を出させるため（プラン 4.7）。
      # CSV_FILE・USER_ID・USER_WORKING_DIR（task を実行したディレクトリ）は q で引用して渡す（空白や & ; があっても1つの値にするため）。
      # 未設定の変数は default "" で空にする（未設定の変数を q に渡すとテンプレートが失敗するため）。
      # DATABASE_URL の決め方と渡し方、silent にする理由は db:migrate と同じ。
      - cmd: DATABASE_URL={{q (.DATABASE_URL | default .DEV_DATABASE_URL)}} go run ./cmd/import-trades -csv {{q (.CSV_FILE | default "")}} -user {{q (.USER_ID | default "")}} -workdir {{q .USER_WORKING_DIR}}
        silent: true

  prices:import:
    desc: 価格の CSV の終値を、今日（日本時間）の終値として登録する（CSV_FILE が必須。同じ銘柄・同じ日の終値は上書きする）
    summary: |
      マイグレーションを適用してから（db:migrate）、CSV_FILE の各行の終値を、実行した日（日本時間）を取引日として
      DATABASE_URL の DB（既定は開発用 DB）に登録する（価格の CSV の登録の要件1〜要件10）。取引日は CSV に書かない。
        例: task prices:import CSV_FILE=prices.local.csv
        見本で試す例（リポジトリの直下で実行。銘柄は task db:seed で入れたもの）:
          task prices:import CSV_FILE=backend/db/seed/prices.example.csv
      よくある誤りの直し方: Excel では「CSV UTF-8（コンマ区切り）」で保存する（文字コードの誤りになるため）。
      終値に3桁区切りのカンマ（1,000 など）は使えない（数字だけで書く）。
      CSV_FILE の相対パスは、task を実行したディレクトリからのパス（backend/ からではない）。絶対パスも使える。
      見本の CSV は backend/db/seed/prices.example.csv。自分の価格は *.local.csv（git 管理外）に置く。
      登録は、同じ銘柄・同じ取引日の終値があれば上書きし、なければ足す（ほかの終値・銘柄マスタ・売買履歴は変えない）。
      銘柄マスタにない銘柄コードの行は、誤りにせず飛ばして標準出力に出す。
      CSV に誤りが1つでもあれば、誤りをすべて標準エラーに出して、何も変えずに終わる。
      成功は終了コード 0。誤りのときは、cmd/import-prices が 1 で終わるが、task は失敗したコマンドの終了コードを既定で 201 にして返す
      （task -x prices:import で実行すると 1 のまま返る）。成否は 0 かどうかで判断する。
      CSV の書き方（見出し・列・誤りの文言）は docs/requirements/price-import.md の要件4〜要件8 と「CSV の誤りの文言」。
    # マイグレーションを先に適用するのは、未適用の DB に登録して、テーブルがないと失敗しないようにするため（trades:import と同じ）。
    # db:up は db:migrate の deps にあるので、ここには書かない。
    deps: [db:migrate]
    dir: backend
    cmds:
      # requires: を使わないのは、CSV_FILE がないときに、task が独自の文言で止まらず、
      # 空のまま cmd/import-prices に渡して「CSV_FILE を指定してください」を出させるため（プラン 4.5）。
      # CSV_FILE・USER_WORKING_DIR（task を実行したディレクトリ）は q で引用して渡す（空白や & ; があっても1つの値にするため）。
      # 未設定の変数は default "" で空にする（未設定の変数を q に渡すとテンプレートが失敗するため）。
      # DATABASE_URL の決め方と渡し方、silent にする理由は db:migrate と同じ。
      - cmd: DATABASE_URL={{q (.DATABASE_URL | default .DEV_DATABASE_URL)}} go run ./cmd/import-prices -csv {{q (.CSV_FILE | default "")}} -workdir {{q .USER_WORKING_DIR}}
        silent: true

  backend:build:
    desc: Go のコマンド（api・migrate・fetch-prices・import-trades・import-prices）をビルドして backend/build/ に置く（build/ は git 管理外）
    dir: backend
    cmds:
      - go build -o build/ ./cmd/...

  backend:test:
    desc: Go の単体・統合テスト（統合テストは TEST_DATABASE_ADMIN_URL の PostgreSQL にテストごとの DB を作る）
    deps: [db:up]
    dir: backend
    cmds:
      # DB の中身はテスト結果のキャッシュの判定に入らないので、-count=1 でキャッシュを使わず毎回実行する。
      # -parallel を明示するのは、既定が CPU の数（GOMAXPROCS）で、CPU が1つの環境では並列のサブテストが同時に動けず、
      # 互いの書き込みを待つテストが時間切れで失敗するため。
      # 4 にするのは、テストごとの DB への接続（testdb は1つの DB に最大2本）を合わせても、
      # PostgreSQL の max_connections（既定 100）に十分に収まるようにするため。
      - go test -count=1 -parallel 4 ./...

  backend:lint:
    desc: golangci-lint を実行する（backend/.golangci.yml）
    dir: backend
    cmds:
      - golangci-lint run

  backend:vuln:
    desc: govulncheck で、依存と Go の標準ライブラリの既知の脆弱性を検査する（実際に呼んでいるものがあれば失敗する）
    dir: backend
    cmds:
      # 標準ライブラリの脆弱性は、go.mod の toolchain で指定した Go の版で判定される。
      # 見つかったら、修正された版の Go を toolchain に指定するか、依存を上げて直す。
      - govulncheck ./...

  frontend:dev:
    desc: フロントエンドの dev サーバーを起動する（http://localhost:5173。/api は API_PROXY_TARGET、既定 http://127.0.0.1:8080 に転送する）
    dir: frontend
    cmds:
      # npm run dev（frontend/package.json の "dev": "vite"）と同じことを、npm を通さずに行う。
      # task dev の failfast で止めるとき、Windows では task が止めるのは直接の子のプロセスだけなので、
      # npm を通すと、その先の Vite が裏に残ってポートをつかんだままになるため（PR④ ステップ6 の EC-8。2026-10-10 に確認）。
      # package.json の "dev" を変えるときは、ここもあわせて変える。
      - node node_modules/vite/bin/vite.js

  frontend:build:
    desc: フロントエンドを型チェック（src・test）してビルドする
    dir: frontend
    cmds:
      - npm run build

  frontend:test:
    desc: フロントエンドの単体テスト（Vitest。frontend/test/）を実行する
    dir: frontend
    cmds:
      - npm test

  frontend:lint:
    desc: フロントエンドを ESLint でリントする（frontend/eslint.config.js）
    dir: frontend
    cmds:
      - npm run lint

  frontend:audit:
    desc: フロントエンドの npm の依存（devDependencies を含む）の既知の脆弱性を検査する（high 以上があれば失敗する）
    dir: frontend
    cmds:
      # npm のレジストリに問い合わせるので、ネットワークが必要。
      # 見つかったら npm audit で内容を確かめ、依存を上げて直す（PR④ ステップ6 の S-3）。
      - npm audit --audit-level=high

  e2e:
    desc: E2E テスト（Playwright）を実行する（API とフロントエンドの dev サーバーは Playwright が起動する）
    dir: e2e
    cmds:
      - npx playwright test

  e2e:audit:
    desc: E2E の npm の依存の既知の脆弱性を検査する（high 以上があれば失敗する）
    dir: e2e
    cmds:
      # 理由と直し方は frontend:audit と同じ。
      - npm audit --audit-level=high

  e2e:api:
    desc: E2E 用の API サーバーを起動する（zero_e2e を作り直し、利用者A として 127.0.0.1:8081 で待ち受ける。E2E の実行時に Playwright が起動する）
    summary: |
      E2E 用の DB zero_e2e を作り直して（マイグレーション → db/seed/test.sql）から、API サーバーを起動する（プラン 4.5）。
      e2e/playwright.config.ts の webServer が起動し、テストが終わると止める。手で起動する必要はない。
        - ポートは 8081（開発用の API の 8080 と重ならないように）。
        - DEV_USER_ID は利用者A（00000000-0000-0000-0000-00000000000a）。E2E のテストは利用者A の売買履歴を入れる。
        - 株価取得の定時実行はしない（テストの途中で価格が書き換わらないように）。
      DATABASE_URL・PORT・DEV_USER_ID は呼び出し側の値を使わず、ここで決めた値で上書きする。
    deps: [db:up]
    dir: backend
    cmds:
      # DATABASE_URL などをコマンドの前に付けて渡す理由と、silent にする理由は db:migrate と同じ。
      # -recreate は DB 名が zero_e2e のときだけ動く（cmd/migrate が確かめる）。
      - cmd: DATABASE_URL={{q .E2E_DATABASE_URL}} go run ./cmd/migrate -recreate -seed db/seed/test.sql
        silent: true
      - cmd: DATABASE_URL={{q .E2E_DATABASE_URL}} PORT={{q .E2E_API_PORT}} DEV_USER_ID={{q .E2E_DEV_USER_ID}} PRICE_FETCH_SCHEDULE_ENABLED=false go run ./cmd/api
        silent: true

  check:
    desc: その PR の時点で設定済みのチェックをすべて実行する（ステップ5の合否の入口）
    cmds:
      - task: backend:lint
      - task: backend:vuln
      - task: frontend:audit
      - task: e2e:audit
      - task: backend:test
      - task: frontend:lint
      - task: frontend:test
      - task: frontend:build
      - task: e2e
